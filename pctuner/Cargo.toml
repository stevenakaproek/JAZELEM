[package]
name = "pctuner"
version = "1.3.2"
edition = "2021"
description = "PC Tuner - services, startup, scheduler, bloat removal, network, fan control, USB port finder and RTX 5080 profiles in one app"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Services", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader"] }
tray-icon = "0.19"
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem", "Foundation", "Foundation_Collections", "Management_Deployment", "ApplicationModel"] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
